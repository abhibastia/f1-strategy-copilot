# The medallion pipeline: Bronze → Silver → Gold in one triggered pipeline.
#
# One pipeline spanning three schemas rather than three pipelines: Free Edition
# limits concurrency, and a single DAG produces one continuous lineage graph.
# Datasets use fully-qualified names built from the `f1.catalog` configuration
# below, so `schema:` here only decides where an unqualified dataset would land.

resources:
  pipelines:
    f1_medallion_pipeline:
      name: f1_medallion_pipeline

      catalog: ${var.catalog}
      schema: bronze

      serverless: true
      photon: true
      # Triggered, not continuous — the source is post-session batch data, and
      # continuous would retry failed updates indefinitely against a daily quota.
      continuous: false
      channel: PREVIEW

      configuration:
        # Read by every transformation file to build fully-qualified names.
        f1.catalog: ${var.catalog}
        f1.landing_root: ${var.landing_root}

      # Publishing the event log to a UC table is what makes data-quality
      # metrics queryable from SQL and chartable on the dashboard.
      event_log:
        catalog: ${var.catalog}
        schema: gold
        name: pipeline_event_log

      libraries:
        - glob:
            include: ../src/pipeline/**
